<!-- News Section -->
<section id="news">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>News</h2>
        <br><br>
      </div>
    </div>
    <div class="news-scroll-wrapper">
      <button class="news-scroll-btn news-scroll-prev" id="news-prev"><i class="fas fa-chevron-left"></i></button>
      <div class="news-flex-row" id="news-row">
        {% for post in site.posts %}
        <div class="news-flex-item news-card">
          <div class="news-card-date">{{ post.date | date: "%B %d, %Y" }}</div>
          <h4 class="news-card-title">{{ post.title }}</h4>
          <p class="news-card-excerpt">{{ post.excerpt }}</p>
          <a href="{{ post.url | relative_url }}" class="news-card-link">Read more &rarr;</a>
        </div>
        {% endfor %}
      </div>
      <button class="news-scroll-btn news-scroll-next" id="news-next"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
</section>

<script>
  $(document).ready(function() {
    var row = document.getElementById('news-row');
    var scrollAmount = 320;
    $('#news-next').on('click', function() {
      row.scrollLeft += scrollAmount;
    });
    $('#news-prev').on('click', function() {
      row.scrollLeft -= scrollAmount;
    });
  });
</script>
